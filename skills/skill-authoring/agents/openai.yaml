interface:
  display_name: "Skill Authoring"
  short_description: "Assemble and check prompt-first skill packages"
  default_prompt: "Use $skill-authoring to build, restructure, or check this skill package: a description that decides loading, an entry file that puts what the agent most needs first, references loaded only when needed, and a check that it triggers and reaches the agent whole. Build whatever the skill teaches with $intuition-building."

policy:
  allow_implicit_invocation: true
