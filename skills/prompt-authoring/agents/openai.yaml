interface:
  display_name: "Prompt Authoring"
  short_description: "Write, edit, refactor, and audit prompts"
  default_prompt: "Use $prompt-authoring to write, edit, refactor, or audit a prompt, including Markdown-backed Codex goal prompt files and paste-sized /goal prompts, so it fits the user's intent, evidence needs, constraints, completion rules, and output shape without becoming brittle or overbuilt. Match the recipient's judgment and response depth to its task, separately from the parent's final summary format. For a Pro consultation or an audit brief under $delegated-implementation, the user's phrasing supersedes the scaffold: sources whole, status as a belief, one intent question, no verdict token, cap, fence, or SHA. For prompts that dispatch model agents, apply the installed shared orchestration policy to the actual populated brief, make all seven dispatch decisions coherent, keep caller conjecture challengeable instead of laundering it into task authority, and reject bare ambiguous fresh, fork, resume, or parallel language."

policy:
  allow_implicit_invocation: true
