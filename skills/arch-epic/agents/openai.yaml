interface:
  display_name: "Arch Epic"
  short_description: "Run a fixed-scope epic through ordered arch-step sub-plans"
  default_prompt: "Use $arch-epic to decompose this authorized execution goal into approved ordered sub-plans and run the selected arch-step lifecycle. Preserve the approved destination and scope; issue decomposition alone does not authorize this workflow."

