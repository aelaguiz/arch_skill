interface:
  display_name: "Milestone To PR"
  short_description: "Spec milestone delivered as one PR, reviewed once"
  default_prompt: "Use $milestone-to-pr on the named milestone. Deliver it as one branch and one PR per code repo (or the project's existing working PR), with issues landing as commits; no per-issue PRs, drafts, or stacks. Delivery rules the user already wrote on the issues outrank these defaults. Seats are read exactly as the user names them (for example primary Opus max, final Pro). With none named, the final is GPT-6 Astra Pro and the primary is a native child on your own model in a clean context. The final writes the milestone plan once with consultation template K; carry it onto disk verbatim and comment on every issue the rule that CI and the final review happen at the milestone boundary. Before the first issue, prove the verification path the plan relies on actually runs, and fix it first if it does not. The primary reads each issue as it lands with template A; keep independent work moving during that read. Intermediate pushes do not wait on or read CI. At the boundary, push normally, send the final template L at once, read CI and bot results when the final answers, fix every warranted finding in one batch, then run one B round; a fresh L only when a fix changed the design. In this lane CI starts with the boundary push instead of after the review. The repair push runs CI again; red in the milestone's own changes gets fixed, red from outside the milestone is named. Every consultation is written from $chatgpt-web's consultation templates in their own words, every question kept, in the user's voice with sources attached whole and no secret values; reach Pro through $chatgpt-web and $browseros with literal Pro read back from the picker before every Send, in consultation profiles only, never Work. Apply $delegated-implementation: workers code, test, and repair; you review every changed line and author all skill content. Never leave work in flight unwatched (end a turn only when the harness will wake you as it lands), never stop for authority the run already has, never merge or release."
policy:
  allow_implicit_invocation: false
