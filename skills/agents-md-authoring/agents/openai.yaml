interface:
  display_name: "AGENTS.md Authoring"
  short_description: "Write and revise AGENTS.md and CLAUDE.md files as a few intuitions, not a pile of rules"
  default_prompt: "Use $agents-md-authoring to write, revise or audit an AGENTS.md, CLAUDE.md or other always-on instruction file. Make it a handful of intuitions about the project, each said in a breath, built with $intuition-building, with facts such as commands and paths as plain lines beside them. Land a new lesson or correction by deepening the intuition it belongs to and taking out what that makes unnecessary, and keep the docs the file points to teaching the same thing."

policy:
  allow_implicit_invocation: true
