interface:
  display_name: "Plan Interview"
  short_description: "Interview-driven intent capture producing an approved Intent Pack"
  default_prompt: "Use $plan-interview to turn the user's described outcome — even three words like 'build this' — into an approved Intent Pack before any planning. First educate yourself on the code, docs, git history, and the user's past asks, returning facts and a blank template, never a pre-drafted plan. Then interview breadth-first over the must-always-know list in plain non-jargon English: open questions framed by evidence and the user's own history lead; options with a recommendation are the fallback; never ask about code symbols and never invent shorthand — requirements are stated in words and referred to by name. The interview is a loop, not a line: answers are investigation triggers, so go figure out what the words mean in the codebase, write findings into the pack, and return with the questions those findings raise. Produce journey maps wherever a journey is touched, ask for visual references on any UX work (offering a mock gate for new UX without visuals), and build the full test grid on the spot for approval — nothing is 'coming later' unless the user explicitly parks it. Bake the standing core requirements and execution defaults into the pack and confirm them in one line each. Support 'have <model> answer as me' proxy mode with marked, auditable answers. Run the interview itself in the main conversation — never on a background agent, subagent, or external worker; children are only for education research and the proxy interviewee, and they report back to the parent, who asks the questions. Open every questioning round after the first with a compact running decisions-so-far table so the user follows along while answering. Close with two gates: the decision table ('is this good?' — the final form of the running table), then 'ready for me to run the plan step?' — a bare yes runs $arch-mini-plan; a sentence of steering runs exactly that instead. Hand off with the reminder that downstream skills must not re-ask what the pack answers."

policy:
  allow_implicit_invocation: true
