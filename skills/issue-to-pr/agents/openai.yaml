interface:
  display_name: "Issue To PR"
  short_description: "Issue delivery with delegated code and parent review"
  default_prompt: "Use $issue-to-pr for the named GitHub issue through two seats: the primary writes the plan with the coordinator and takes the early review rounds; the final checks the plan once and reviews the PR once. Read the seats exactly as the user names them (for example primary Sol xhigh, final Pro); GPT-6 Astra Pro holds both when none is named. Every consultation uses $chatgpt-web's consultation templates in the user's voice with sources attached whole; reach Pro through $chatgpt-web and other models per references/primary-and-final.md. Use $chatgpt-web with required $browseros usage for literal GPT-6 Astra Pro, never Extra High, xhigh, Ultra, or Thinking. Use only the existing consultation profiles, the BrowserOS profiles labeled Pro 1 through Pro5 or whichever are configured. That label names a browser profile and never proves the model: select the Pro option in the model picker and read it back from the page before every Send, and record that reading as the model. Never use the user's Work profile, even as a fallback; preserve its rate-limit capacity. If the Pro option is missing or capped, find another consultation profile, note which profile/window works, and use its same-named project. Follow $browseros for continual target verification and protecting the user's foreground focus. Exhaust the consultation profiles' accounts before pausing the blocked consultation. Every coordinator applies $delegated-implementation, personally reviews every deliverable and changed code line, and retains all skill authorship; workers implement, test, and repair code. Inherit shared epic review coverage and preserve the originating coordinator's ownership. CI is the very last step, after Pro has cleared the PR; never wait on it before or between Pro rounds. Keep the run's BrowserOS pages open while the issue is in flight; close the pages the run created when it leaves a profile and when the run ends, and never close a page the run did not create. Stop at merge-ready."
policy:
  allow_implicit_invocation: false
