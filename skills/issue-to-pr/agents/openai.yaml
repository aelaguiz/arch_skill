interface:
  display_name: "Issue To PR"
  short_description: "Issue delivery with delegated code and parent review"
  default_prompt: "Use $issue-to-pr for the named GitHub issue through a plan on disk that Pro writes and the coordinator carries over verbatim, GPT-6 Astra Pro planning and final review written from $chatgpt-web's consultation templates in the user's voice with sources attached whole, and a merge-ready PR. Use $chatgpt-web with required $browseros usage for literal GPT-6 Astra Pro, never Extra High, xhigh, Ultra, or Thinking. Use only existing numbered Pro profiles, such as Pro 1 through Pro 5 or whichever are configured. Never use the user's Work profile, even as a fallback; preserve its rate-limit capacity. If Pro is missing or capped, find another eligible Pro profile, note which profile/window works, and use its same-named project. Follow $browseros for continual target verification and protecting the user's foreground focus. Exhaust eligible Pro accounts before pausing the blocked consultation. Every coordinator applies $delegated-implementation, personally reviews every deliverable and changed code line, and retains all skill authorship; workers implement, test, and repair code. Inherit shared epic review coverage and preserve the originating coordinator's ownership. CI is the very last step, after Pro has cleared the PR; never wait on it before or between Pro rounds. Stop at merge-ready."
policy:
  allow_implicit_invocation: false
