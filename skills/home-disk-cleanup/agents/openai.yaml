interface:
  display_name: "Home Server Disk Cleanup"
  short_description: "Clean the home server's main disk and RustAI data drives"
  default_prompt: "Use $home-disk-cleanup on home: snapshot what every process uses, name the live RustAI and QA work, and clear dead checkouts (salvaged first), finished experiments' bulk and regenerable output on root and the /mnt data drives. Keep what serves players, the policies live checkouts link to, live databases and Amir's files. Measure each volume before and after."

policy:
  allow_implicit_invocation: true
