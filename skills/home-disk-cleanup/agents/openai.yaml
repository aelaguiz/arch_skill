interface:
  display_name: "Home Server Disk Cleanup"
  short_description: "Clean root and data drives on the home training server"
  default_prompt: "Use $home-disk-cleanup on home to maintain root headroom by removing inactive reproducible build output, including recent builds, and obsolete test/training clutter. Preserve active work, source and retained policies. Verify available space separately on root and the mounted /mnt drives."

policy:
  allow_implicit_invocation: true
