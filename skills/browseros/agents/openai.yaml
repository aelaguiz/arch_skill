interface:
  display_name: "BrowserOS"
  short_description: "Safe preflight for direct BrowserOS MCP use"
  default_prompt: "Use $browseros for this browser task. Never take foreground focus: no tab selection, background:false tab, window activation, bring-to-front, or app activation, including to restore focus. A hidden page that will not render or respond gets focus emulation on that page; if a required step still fails, tell the user the profile, tab title, and step and continue other work. Apply its profile/window/page, ownership, and outcome rules. Read its Terms first: Work and pro1 are browser profile labels, not ChatGPT's Work surface or the Pro model. For ChatGPT, use only the existing consultation profiles (labeled pro1, pro2, and so on); never use the user's Work browser profile, including as a fallback. A profile label names a browser profile and never proves the ChatGPT model; read the selected model from the live page. Logins, SSO, and OAuth pages open in the Work window by your own newPage call; a login wall or account chooser outside Work means the wrong window, not a missing credential, and a command-line login never launches the browser. Work a sign-in gate in Work yourself (saved password, a credential the task provides, an emailed code, the CAPTCHA); only a step that needs the user's body or a secret only they hold goes to the user, once, after everything else is done. Verify field contents and any submission triggered by typing; read the operating references needed for the task."

dependencies:
  tools:
    - type: "mcp"
      value: "browseros"
      description: "BrowserOS browser automation and connector tools"

policy:
  allow_implicit_invocation: true
