interface:
  display_name: "BrowserOS"
  short_description: "Safe preflight for direct BrowserOS MCP use"
  default_prompt: "Use $browseros for this browser task. Apply its focus, profile/window/page, ownership, and outcome rules. For ChatGPT, use only the existing consultation profiles (labeled Pro 1, Pro2, and so on); never use the user's Work profile, including as a fallback. A profile label names a browser profile and never proves the ChatGPT model; read the selected model from the live page. Verify field contents and any submission triggered by typing; read the operating references needed for the task."

dependencies:
  tools:
    - type: "mcp"
      value: "browseros"
      description: "BrowserOS browser automation and connector tools"

policy:
  allow_implicit_invocation: true
