interface:
  display_name: "BrowserOS"
  short_description: "Safe preflight for direct BrowserOS MCP use"
  default_prompt: "Use $browseros for BrowserOS work and all Codex CLI browser automation. Reuse existing windows and background pages, verify the intended profile and site identity, and clean up task-created state. Foreground changes require the user's request; BrowserOS unavailability is a blocker, not permission to switch browser tools."

dependencies:
  tools:
    - type: "mcp"
      value: "browseros"
      description: "BrowserOS browser automation and connector tools"

policy:
  allow_implicit_invocation: true
