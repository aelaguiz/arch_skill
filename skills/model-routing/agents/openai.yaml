interface:
  display_name: "Model Routing"
  short_description: "Choose every helper's model and thinking level"
  default_prompt: "Use $model-routing to choose the model and thinking level for the helper you are about to start: decide why this helper exists, which kind of work it is, how many times it will run and whether anyone is waiting, then set both a model and a level."

policy:
  allow_implicit_invocation: true
