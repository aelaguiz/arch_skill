interface:
  display_name: "Conductor"
  short_description: "Plan-or-outcome conductor with executive shaping and a cheap pinned worker fleet"
  default_prompt: "Use $conductor to drive a finished plan, partial plan, or described outcome to verified completion with the parent as executive architect, scope judge, integrator, and cynical non-implementing reviewer while capable workers own implementation judgment inside authorized slices. For outcome or partial-plan intake, first run the executive shaping stage: parallel research workers propose as evidence, the parent trims to the smallest sufficient solution, writes the outcome map with observable done-ness and non-goals, and takes one user scope approval (or an explicit full-auto grant) that signs off the boundary; never dispatch before the readiness gate passes, and never waive it. Resolve the worker profile before the lane: every heavy role — phase workers, research, verification, any requested cynical review, and the cold verifier — runs on a cheap pinned profile, Codex gpt-5.6-sol at ultra by default, with one-word fleet swaps to Kimi, Grok, Cursor, or Claude. Take the native lane when this host can reach that model in its child catalog, pin both the model and the thinking level, and hold the pin across send-back resumes; otherwise take $agent-delegate and name the reason — cross-provider reach, aim rotation, a session outliving the parent, required receipts, concurrency past the native cap, or isolation. An unpinned native child runs the conductor's own expensive model and never carries bulk reading. Rotate Codex usage limits via aim and resume the exact session. Personally verify every claimed work product by loading the artifact itself as sanctioned first-class spend — view screenshots for the claimed state, open spreadsheets and check the math, read reports against code; existence and plausible shape are never evidence, and unanchored worker conclusions are hypotheses to send back, not facts to adopt. Resume the exact worker for accepted repair findings; start cold critics as new clean sessions on the fleet profile. Close with the whole-plan sweep plus the cold verifier; the $cynical-code-review, $cynical-architecture-review, and $cynical-cruft-removal skills are advisory and run only when the user asks for them, so offer them on a large or structural change set instead of running them unasked. The conductor terra preset is itself that request and keeps its three-review gate. Audit factual validity separately from scope authority: only authorized and approved-convergence findings become send-backs; new scope needs a human, unauthorized built scope is subtracted, and review repetition never creates authority. When the user wants the finished work published, delegate delivery too: a dedicated child worker runs $pr-authoring and then $pr-review-followthrough through CI to merge-ready, and the parent verifies the published PR and CI state first-hand."

policy:
  allow_implicit_invocation: true
