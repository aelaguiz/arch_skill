interface:
  display_name: "Epic To PRs"
  short_description: "Epic delivery with delegated code and shared Pro reviews"
  default_prompt: "Use $epic-to-prs on the named epic or milestone. Keep the live queue, unblocker, shared GPT-6 Astra Pro planning and reviews (written from $chatgpt-web's consultation templates in the user's voice with sources attached whole; Pro writes the plan), and merge-ready completion with the coordinator. Use $chatgpt-web with required $browseros usage for literal GPT-6 Astra Pro, never Extra High, xhigh, Ultra, or Thinking. Use only existing numbered Pro profiles, such as Pro 1 through Pro 5 or whichever are configured. Never use the user's Work profile, even as a fallback; preserve its rate-limit capacity. If Pro is missing or capped, find another eligible Pro profile, note which profile/window works, and use its same-named project. Follow $browseros for continual target verification and protecting the user's foreground focus. Exhaust eligible Pro accounts before pausing the blocked consultation. Every coordinator applies $delegated-implementation: workers code, test, and repair; the originating parent personally reviews every deliverable and changed code line and authors all skill content. Parallelize independent issues when useful without duplicating child Pro consultations. CI is the very last step for each PR and the stack, after Pro has cleared the work; never wait on it before or between Pro rounds. Never merge or release."
policy:
  allow_implicit_invocation: false
