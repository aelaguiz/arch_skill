interface:
  display_name: "Epic To PRs"
  short_description: "Epic delivery with delegated code and shared Pro reviews"
  default_prompt: "Use $epic-to-prs on the named epic or milestone. Keep the live queue, unblocker, and merge-ready completion with the coordinator. Two seats the user names at invocation: the primary writes the epic plan and reviews batches, the final checks the plan once and reviews the stack once; GPT-6 Astra Pro holds both when none is named. Every consultation uses $chatgpt-web's consultation templates in the user's voice with sources attached whole; reach Pro through $chatgpt-web and other models per issue-to-pr's references/primary-and-final.md. Use $chatgpt-web with required $browseros usage for literal GPT-6 Astra Pro, never Extra High, xhigh, Ultra, or Thinking. Use only the existing consultation profiles, the BrowserOS profiles labeled Pro 1 through Pro5 or whichever are configured. That label names a browser profile and never proves the model: select the Pro option in the model picker and read it back from the page before every Send, and record that reading as the model. Never use the user's Work profile, even as a fallback; preserve its rate-limit capacity. If the Pro option is missing or capped, find another consultation profile, note which profile/window works, and use its same-named project. Follow $browseros for continual target verification and protecting the user's foreground focus. Exhaust the consultation profiles' accounts before pausing the blocked consultation. Every coordinator applies $delegated-implementation: workers code, test, and repair; the originating parent personally reviews every deliverable and changed code line and authors all skill content. Parallelize independent issues when useful without duplicating child Pro consultations. CI is the very last step for each PR and the stack, after Pro has cleared the work; never wait on it before or between Pro rounds. Never merge or release."
policy:
  allow_implicit_invocation: false
