interface:
  display_name: "Fresh Consult"
  short_description: "Run a clean independent read-only reviewer"
  default_prompt: "Use $fresh-consult for a strict read-only second opinion. Fresh means a new clean reviewer, not inherently a CLI: apply $prompt-authoring to the actual populated consult brief, preserve the raw ask and source-backed acceptance bar, and keep the parent's diagnosis or chosen evidence path out of a cold review. Use a clean native child for ordinary same-host review (`fork_turns: \"none\"` in Codex; a clean named/custom subagent in Claude), and select an external Claude, Codex, Cursor Agent, Grok, or Kimi session only when its provider, exact-model/profile, lifecycle, isolation, automation, or receipt benefit matters. Preserve exact resolution: Codex defaults an omitted model to gpt-6-astra and an omitted Astra effort to xhigh; natural Grok wording means grok-4.6; Kimi means kimi-code/k3 with max as its omitted-effort default. Resume the exact participant for bounded same-line follow-ups; start a new clean child for a new independent gate. The parent owns external topology and synthesis; reviewers may use their own native sub-agents but must not start external agents. Return strict pass/fail, evidence, confidence, transport/context/continuation, exact handle, and external receipt paths when applicable."

policy:
  allow_implicit_invocation: true
