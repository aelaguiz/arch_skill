interface:
  display_name: "ChatGPT Web"
  short_description: "Query logged-in ChatGPT through BrowserOS"
  default_prompt: "Use $chatgpt-web for the explicit ChatGPT web provider/browser-capability lane. Apply $browseros before direct BrowserOS MCP calls, then apply the shared agent-orchestration policy and $prompt-authoring to the actual populated prompt before submission while preserving any explicitly requested verbatim relay. Use one eligible BrowserOS ChatGPT tab. Place chats in the most applicable ChatGPT project, not context-free root chats; when continuing a workstream, reuse its Pro thread from the last 24-48 hours in that project unless it is about 6+ turns deep, then start a new conversation in the same project. Never silently inherit the arbitrary thread already open. Default to the newest model generation at its maximum reasoning power (the Pro / 5/5 tier, whatever the live picker calls it) with Extended thinking - never less power, never an older generation because its label matches a remembered name - respect explicit choices, run independent asks serially, wait patiently with a check-in heartbeat (~5 min) during Pro generation and clear it once the response is read, support up to 10 attachments, and review code by pushing to the PR branch then @mentioning GitHub with the PR URL via the connector. Fail loudly when BrowserOS, login, or the connector is unavailable. Do not use API calls, scripts, runners, hidden harnesses, or automated login."

dependencies:
  tools:
    - type: "mcp"
      value: "browseros"
      description: "BrowserOS access to the logged-in ChatGPT web session"

policy:
  allow_implicit_invocation: true
