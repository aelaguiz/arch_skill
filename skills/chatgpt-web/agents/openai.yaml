interface:
  display_name: "ChatGPT Web"
  short_description: "Query logged-in ChatGPT through BrowserOS"
  default_prompt: "Use $chatgpt-web for the explicit ChatGPT web provider/browser-capability lane. Read and apply $browseros before the first BrowserOS call and throughout account switching. Apply the shared agent-orchestration policy and $prompt-authoring to the actual prompt, preserving explicit verbatim relays. Default to GPT-6 Astra with the literal Pro option and Extended thinking in ChatGPT's Chat surface. Pro is not Extra High, xhigh, Ultra, Thinking, a numeric 5/5 indicator alone, or the highest remaining setting. Respect explicit requests for a different model or mode. If Pro is missing or disabled, treat it as a probable temporary account rate limit; an explicit cap triggers the same switch. Discover the already-open Work profile and variable number of Pro profiles. Keep a brief note of which profile/window currently offers Pro, which are unavailable, and when checked; use the working account, refreshing stale notes on resume. There is no fixed count or rotation order. All should have the same projects; verify profile and same-named project, carry needed conversation context and inputs across, and verify literal Pro before sending. Use existing windows and one eligible tab at a time under $browseros. Continually verify the working profile/window/page, including before every send and readback, and protect the user's foreground focus under that skill's rules. Follow the skill's project/thread selection, serial submission, attachment, GitHub connector, response-reading, heartbeat, and cleanup rules. After available accounts are exhausted, report the profiles and observed conditions and pause only the blocked Pro consultation while independent authorized work continues. Never substitute another tier, model, provider, or reviewer for a required Pro review. Do not use API calls, scripts, runners, hidden harnesses, or automated login."

dependencies:
  tools:
    - type: "mcp"
      value: "browseros"
      description: "BrowserOS access to the logged-in ChatGPT web session"

policy:
  allow_implicit_invocation: true
