interface:
  display_name: "ChatGPT Web"
  short_description: "Query logged-in ChatGPT through BrowserOS"
  default_prompt: "Use $chatgpt-web for this consultation. Read its full entry and required companions, then the consultation-templates family that matches the ask; write the submission in the user's voice with the sources attached whole, no verdict token, no answer cap, no SHA pin. Pro is the model: GPT-6 Astra with the literal Pro option, proven only by the composer's model pill read before every Send (6 Pro) and the served-model slug on the answer to your own message (gpt-6-pro); the account badge, earlier turns' footers, and titles are not readings. The BrowserOS profiles labeled Pro 1, Pro2, and so on are only the consultation profiles; being in one never proves the model. Use only those existing consultation profiles; the Work profile is reserved for the user and must never be used, even as a fallback. Preserve Pro's expert judgment, verify complete delivery, observe its actual thinking activity, and recover stalled consultations without cancelling a correct generation or requiring routine user rescue; a submission that went out without its attachments or pill is stopped at once and resent whole. Return the resulting assessment in the user's preferred form, keeping what Pro was shown separate from what Pro said."

dependencies:
  tools:
    - type: "mcp"
      value: "browseros"
      description: "BrowserOS access to the logged-in ChatGPT web session"

policy:
  allow_implicit_invocation: true
