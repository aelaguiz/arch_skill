interface:
  display_name: "Agent Delegate"
  short_description: "Run explicit external editful worker sessions"
  default_prompt: "Use $agent-delegate only when an external Claude, Codex, Cursor Agent, Grok, or Kimi worker provides a concrete provider, exact-model/profile, lifecycle, process-isolation, automation, or structured-receipt benefit over the active host's native children. Keep ordinary same-host work native. Apply $prompt-authoring to the actual populated worker brief: bind the worker to the source-backed outcome and real constraints, keep parent diagnoses and preferred fixes challengeable, and let the worker own the evidence and implementation path inside scope. Preserve exact model/profile resolution: Codex defaults an omitted model to gpt-5.6-sol and an omitted Sol effort to ultra; Kimi defaults to kimi-code/k3 at max; natural Grok wording resolves to grok-4.5 while explicit legacy ids remain exact. Start clean and resumable by default, and resume only an exact same-runtime handle. The parent owns external fanout and integration; workers may freely use their own native sub-agents but must not spawn external agents themselves. Report the external benefit, mode, status, changed files, verification, blockers, exact session handle, and run directories."

policy:
  allow_implicit_invocation: true
